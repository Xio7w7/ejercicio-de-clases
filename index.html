<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio de clases - Tabla de multiplicar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Tabla de multiplicar</h1>
    <p class="subtitulo" id="subtitulo"></p>

    <section class="tarjeta">
      <table class="tabla">
        <thead>
          <tr>
            <th>Operación</th>
            <th>Resultado</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </section>

    <p class="nota">También puedes ver el resultado en la consola del navegador.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
